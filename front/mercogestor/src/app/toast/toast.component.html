<!-- TOASTS (canto superior) -->
<div class="toast-wrap" aria-live="assertive" aria-atomic="true">
  <div
    class="toast card"
    *ngFor="let t of toasts() | slice:0; trackBy: trackById"
    [class.ok]="t.type==='success'"
    [class.err]="t.type==='error'"
    [class.info]="t.type==='info'"
    [class.hide]="t.variant==='modal'"
    [style.--dur.ms]="t.ms || 3500"
    role="status"
  >
    <div class="toast-icon" aria-hidden="true">
      <svg *ngIf="t.type==='success'" viewBox="0 0 24 24" width="18" height="18" class="ic">
        <path d="M9 16.2l-3.5-3.6-1.4 1.4L9 19 20 8l-1.4-1.4z"></path>
      </svg>
      <svg *ngIf="t.type==='error'" viewBox="0 0 24 24" width="18" height="18" class="ic">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10
                 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"></path>
      </svg>
      <svg *ngIf="t.type==='info'" viewBox="0 0 24 24" width="18" height="18" class="ic">
        <path d="M11 17h2v-6h-2v6zm0-8h2V7h-2v2zm1-7C6.48 2 2 6.48 2 12s4.48
                 10 10 10 10-4.48 10-10S17.52 2 12 2z"></path>
      </svg>
    </div>

    <div class="toast-body">
      <div class="toast-title">
        {{ t.type === 'success' ? 'Tudo certo' : (t.type === 'error' ? 'Opa!' : 'Aviso') }}
      </div>
      <div class="toast-text">{{ t.text }}</div>
    </div>

    <button class="toast-close" (click)="dismiss(t.id)" aria-label="Fechar">×</button>

    <!-- barra de progresso decorativa -->
    <div class="toast-progress" aria-hidden="true"></div>
  </div>
</div>
